name: Backend checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install C compiler
        run: python -m pip install ziglang==0.15.2
      - run: npm ci
      - run: npm run build:engine
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
